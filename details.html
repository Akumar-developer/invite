<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kab aur Kahan 🕒</title>
<link rel="stylesheet" href="Style.css" />
</head>
<body>
  <div class="hearts-bg"></div>
  <div class="big-heart-watermark"><div class="heart-shape"></div></div>

  <div class="page">
    <div class="card">
      <!-- <p class="eyebrow">Yesss, decided</p> -->
      <h1 class="headline">Kab aur kahan milegi jaane mann?</h1>
      <!-- <p class="sub">Bas time aur jagah bata de, baaki main dekh lunga.</p> -->
      <p class="sub">Aur hn mere geographer koi acchi si jgh bta diyo</p>

      <form class="details-form" id="detailsForm">

        <!-- Web3Forms spam honeypot.
             Normal user ise kabhi check nahi karega. -->
        <input
          type="checkbox"
          name="botcheck"
          tabindex="-1"
          autocomplete="off"
          style="display: none ! important;"
        />

        <div>
          <label class="field-label" for="locationField">Location</label>
          <input
            type="text"
            id="locationField"
            placeholder="shant si jgh..."
            required
          />
        </div>

        <div>
          <label class="field-label" for="timeField">Time</label>
          <input
            type="time"
            id="timeField"
            required
          />
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          fix kr de  💌
        </button>

        <p class="status-msg" id="statusMsg"></p>
      </form>
    </div>
  </div>

  <script src="Script.js"></script>
</body>
</html>
